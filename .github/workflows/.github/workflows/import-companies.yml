name: import-companies
# Run manually: Actions -> import-companies -> Run workflow. Verifies every slug in data/companies.csv and activates the ones that exist.
on: workflow_dispatch
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run companies:import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PING_USER_AGENT: ${{ secrets.PING_USER_AGENT }}
